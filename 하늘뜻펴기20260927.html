<!-- 여는 찬양 239 「아버지 당신 손에」 -->
<script type="text/plain" id="lyrics-239">
아버지 당신 손에 내 영혼 맡기나이다
</script>
<!-- 함께 부르는 노래 206 「선생님 말씀」 -->
<script type="text/plain" id="lyrics-206">
천하장사 할아버지도 제힘인줄 착각한다면
엄마 젖을 빨아먹는 젖먹이를 지켜보시오
한다는 생각으로 하는 것은 하는 이가 당신이고
한다는 생각 없이 하는 것은 하나님이 하는 것이오
</script>
<!-- 결단의 찬양 794 「허공같은 사람」 -->
<script type="text/plain" id="lyrics-794">
사랑이신 한님 내가 아직 흙 속에 씨앗임을 알게 하시고
행여 제 힘으로 뭘 하려고 하면 가차없이 죽여주소서
그리하여 우주가 나로 하여금 무슨 노래나 부를 수 있도록
허공같은 사람 되게 하소서
</script>

:root{
  --paper:#ece2cb; --paper-edge:#d8c9a8;
  --ink:#1b1916; --red:#a52a1f; --gray:#5f574b; --light:#a99d86;
  --ui:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper-edge:#2a2621; } }
:root[data-theme="dark"]{ --paper-edge:#2a2621; }
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper-edge);}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;cursor:default;user-select:none;}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--paper);box-shadow:0 0 60px rgba(0,0,0,.25);}
#paper{position:absolute;inset:0;width:1600px;height:900px;}
#content{position:absolute;inset:0;transition:opacity .38s ease;}
#ink{position:absolute;inset:0;width:1600px;height:900px;overflow:visible;}
#texts{position:absolute;inset:0;}
.it{transition:opacity .75s ease;}
.it.fast,#content.noanim .it{transition:none!important;}
/* text */
.tx{position:absolute;white-space:nowrap;line-height:1.25;color:var(--ink);
  text-shadow:0 0 1px rgba(27,25,22,.28),0 0 7px rgba(27,25,22,.05);}
.tx .ln{display:block;}
.tx .w{display:inline-block;white-space:nowrap;}
.tx .ch{display:inline-block;opacity:0;}
.tx.anim .ch{
  -webkit-mask-image:linear-gradient(118deg,#000 0 40%,rgba(0,0,0,.45) 49%,transparent 58%);
          mask-image:linear-gradient(118deg,#000 0 40%,rgba(0,0,0,.45) 49%,transparent 58%);
  -webkit-mask-size:330% 100%;mask-size:330% 100%;
  -webkit-mask-position:100% 0;mask-position:100% 0;
  animation:inkIn var(--cd,520ms) cubic-bezier(.22,.6,.3,1) forwards;animation-delay:var(--t,0ms);}
.tx.v.anim .ch{
  -webkit-mask-image:linear-gradient(180deg,#000 0 40%,rgba(0,0,0,.45) 49%,transparent 58%);
          mask-image:linear-gradient(180deg,#000 0 40%,rgba(0,0,0,.45) 49%,transparent 58%);
  -webkit-mask-size:100% 330%;mask-size:100% 330%;
  -webkit-mask-position:0 100%;mask-position:0 100%;
  animation-name:inkInV;}
@keyframes inkIn{0%{opacity:0;-webkit-mask-position:100% 0;mask-position:100% 0;filter:blur(1.4px)}
  14%{opacity:1}100%{opacity:1;-webkit-mask-position:0 0;mask-position:0 0;filter:blur(0)}}
@keyframes inkInV{0%{opacity:0;-webkit-mask-position:0 100%;mask-position:0 100%;filter:blur(1.4px)}
  14%{opacity:1}100%{opacity:1;-webkit-mask-position:0 0;mask-position:0 0;filter:blur(0)}}
.tx.inst .ch{opacity:1;}
.tx .em{color:var(--emc,var(--red));}
.tx.v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.14em;}
.c-red{color:var(--red)!important;text-shadow:0 0 1px rgba(165,42,31,.28);}
.c-gray{color:var(--gray)!important;}
.c-light{color:var(--light)!important;text-shadow:none;}
/* seal */
.seal{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--red);color:#f3e9d2;border-radius:4px;line-height:1.1;letter-spacing:.02em;-webkit-text-stroke:.05em #f3e9d2;
  mix-blend-mode:multiply;transform:rotate(-3deg);opacity:0;filter:url(#sealTex);}
.seal.stamp{animation:stamp .34s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:var(--t,0ms);}
.seal.inst{opacity:.9;}
@keyframes stamp{0%{opacity:0;transform:rotate(-3deg) scale(1.6)}100%{opacity:.9;transform:rotate(-3deg) scale(1)}}
/* 마디 표시 */
.part{position:absolute;left:34px;top:20px;font:22px/1.2 "GowunBatang",serif;color:var(--light);letter-spacing:.06em;pointer-events:none;}
/* 가사 넣기 창 */
#lypanel{position:fixed;inset:0;background:rgba(27,25,22,.55);display:flex;align-items:center;justify-content:center;z-index:20;}
#lypanel[hidden]{display:none;}
#lypanel .box{background:#f6f0e2;color:#231f1a;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:22px 26px;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;font:16px/1.6 var(--ui);user-select:text;}
#lypanel h2{margin:0 0 6px;font-size:21px;}
#lypanel .sub{margin:0 0 14px;color:#6d6453;font-size:14.5px;}
#lypanel label{display:block;margin:0 0 12px;font-weight:600;font-size:15px;}
#lypanel textarea{display:block;width:100%;box-sizing:border-box;margin-top:5px;font:16px/1.6 var(--ui);padding:8px 10px;border:1px solid #cbbd9f;border-radius:8px;background:#fffdf7;resize:vertical;}
#lypanel .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
#lypanel button{font:15px var(--ui);padding:8px 14px;border-radius:8px;border:0;background:#e9dfc8;color:#231f1a;cursor:pointer;}
#lypanel button.main{background:#a52a1f;color:#fff;}
/* HUD & notes */
#hud{position:fixed;right:18px;bottom:12px;font:15px var(--ui);color:#6d6453;opacity:0;transition:opacity .4s;pointer-events:none;letter-spacing:.04em;}
#hud.on{opacity:.85;}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(27,25,22,.78);color:#f3ead6;
  font:15px var(--ui);padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap;}
#hint.on{opacity:1;}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:38vh;overflow:auto;background:rgba(246,240,226,.97);
  border-top:2px solid #b9a988;padding:16px 26px 20px;font:21px/1.7 var(--ui);color:#231f1a;display:none;box-shadow:0 -6px 24px rgba(0,0,0,.15);}
#notes.on{display:block;}
#notes .meta{font-size:14px;color:#7a705f;margin-bottom:6px;}
#notes .cue{color:#8a7f6c;}
#toast{position:fixed;z-index:30;top:18px;left:50%;transform:translateX(-50%);background:#231f1a;color:#f3ead6;font:15px var(--ui);
  padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .4s;pointer-events:none;}
#toast.on{opacity:.95;}
</style>
</head>
<body>
<div id="stage">

function pig(cx,cy,s,dir,gap){ // 붓으로 그린 작은 돼지 (dir 1 = 오른쪽을 봄)
  const rx=70*s, ry=40*s, pts=[];
  for(let i=0;i<=16;i++){ const a=i/16*Math.PI*2, k=1+0.05*Math.sin(3*a);
    pts.push([+(cx+Math.cos(a)*rx*k).toFixed(1), +(cy+Math.sin(a)*ry*k*(Math.sin(a)>0?1.06:0.94)).toFixed(1)]); }
  const X=v=>+(cx+dir*v).toFixed(1), Y=v=>+(cy+v).toFixed(1), L=[[.5,.52],[.2,.2],[-.3,-.32],[-.6,-.62]];
  return [
    {s:'stroke', p:pts, closed:true, w:+(9*s).toFixed(1), gap},
    {s:'enso', c:[X(rx+9*s),Y(-4*s)], r:+(13*s).toFixed(1), a0:-90, sw:350, w:+(6*s).toFixed(1), gap:-150},
    {s:'stroke', p:[[X(rx*.42),Y(-ry*.78)],[X(rx*.6),Y(-ry*1.45)],[X(rx*.78),Y(-ry*.84)]], w:+(6*s).toFixed(1), gap:-150},
    {s:'dot', c:[X(rx*.72),Y(-ry*.18)], r:+(4.5*s).toFixed(1), gap:-150},
    ...L.map(([a,b])=>({s:'stroke', p:[[X(rx*a),Y(ry*.88)],[X(rx*b),Y(ry*1.6)]], w:+(7*s).toFixed(1), gap:-150})),

  ];
}

우리도 별들을 선으로 이어 놓고 ‘나’라고 불러 왔습니다. 평생 그 선을 ‘나’로 알고 살았기에, 그 선이 지워지는 일은 죽음처럼 아픕니다.

그런데 꼭 말씀드리고 싶은 것이 있습니다. 지워지는 것은 우리가 그은 선입니다. 우리가 없어지는 것이 아닙니다. 별은 그대로 빛납니다. 옛 사람이 죽는다는 것은, 그 선을 ‘나’라고 꽉 쥐고 있던 손이 풀린다는 뜻입니다.

그래서 십자가는 이천 년 전 골고다의 일이면서, 오늘 우리 안에서 ‘나’라는 선이 지워지는 일이기도 합니다.`},

기억을 되찾은 그 사람도 떠돌이는 사라졌지만 죽지 않았습니다. 오히려 제 이름을 되찾고, 본래의 자기로 살아났습니다.

이 교수는 이것을 부활이라고 읽습니다. 부활은 거듭남, 곧 깨어남이라는 것입니다. 에베소서에 이런 말씀이 있습니다. “잠자는 자여 깨어서 죽은 자들 가운데서 일어나라 그리스도께서 너에게 비추이시리라.” 깨어나는 일과 죽은 자들 가운데서 일어나는 일이 한 문장에 나란히 있습니다.

이 교수는 한 걸음 더 나아가 “진정한 부활은 육의 부활이 아니고 영적인 부활”이라고까지 말합니다. 교회는 오랫동안 몸의 부활을 고백해 왔고, 저는 거기까지 단정하지는 않습니다. 다만 부활을 ‘언젠가’의 일에서 ‘오늘’의 일로 데려오는 말로 귀하게 듣습니다.`},

예수님은 이렇게 답하십니다. “나는 부활이요 생명이니.” 언젠가 그렇게 될 것이라는 말씀이 아닙니다. 지금 ‘내가 부활이다’ 하시는 말씀입니다. 이어서 “무릇 살아서 나를 믿는 자는 영원히 죽지 아니하리니” 하십니다. 살아 있는 지금의 생명입니다.`},

{ id:'grace', name:'오직 은혜', part:P3, steps:[

"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니, 이것은 너희에게서 난 것이 아니요 하나님의 선물이라. 행위에서 난 것이 아니니."

두 군데를 보시면 좋겠습니다. "받았으니." 앞으로 받을 것이 아니라 이미 받았습니다. 그리고 "행위에서 난 것이 아니니."`},

    {s:'text', t:'지금 여기서', x:900, y:554, z:48, f:'s', a:'tc'},
  ], note:`종교개혁 이후 오백 년 동안 개신교가 붙들어 온 말이 있습니다. 오직 은혜.

이문호 교수가 "이 세상 가장 중요한 도표"라 부르는 그림을 쉽게 옮겨 보았습니다. 위는 내 힘으로 가는 길입니다. 내가, 수행과 공로로, 언젠가 도착하려 합니다. 깨달음이든 천국이든 따내야 할 티켓이 됩니다. 이 길에는 끝이 없습니다. 수행으로 도착한 사람은 없습니다. 원래 도표의 위 칸에는 율법과 믿음도 들어 있습니다. 믿음조차 천국 티켓을 따내는 내 행위가 되면, 위의 길이라는 뜻입니다.

아래가 오직 은혜입니다. 하나님이, 은혜로, 지금 여기서 주십니다. 그 끝은 잔치입니다. 우리가 평생 들어 온 '오직 은혜'가 바로 이 뜻이었구나 싶습니다.`},

    {s:'text', t:'모든 인간이 예수 그리스도에게\n구원을 받았는데도 불구하고\n이를 깨닫느냐, 그렇지 못하느냐에 따라\n구원이 달려 있다', x:800, y:410, z:30, f:'s', c:'gray', a:'tc', lh:1.5, gap:500},
    {s:'text', t:'— 관옥 이현주 (가톨릭신문, 1994. 1. 16)', x:800, y:630, z:36, f:'p', c:'red', a:'tc'},
], note:`이현주 선생님은 1994년 교회일치주간에 가톨릭신문과 나눈 인터뷰에서 이렇게 말씀하셨습니다. “모든 인간의 구원은 깨달음의 차이일 뿐.” 그리고 이렇게 풀어 주셨습니다. “모든 인간이 예수 그리스도에게 구원을 받았는데도 불구하고 이를 깨닫느냐, 그렇지 못하느냐에 따라 구원이 달려 있다.”

두 가지를 들으시면 좋겠습니다. 하나, 구원은 이미 일어났습니다. 그리스도 안에서, 모든 사람에게. 구원받은 사람과 못 받은 사람, 두 부류가 따로 있는 것이 아닙니다. 둘, 차이는 그것을 아느냐 모르느냐입니다. 주머니에 돈이 들어 있어도, 모르면 가난하게 삽니다.

이현주 선생님은 그리스도를 구원하신 분으로 분명히 두시면서, 그 구원이 이미 모두에게 이루어졌다고 말씀하십니다. 이문호 교수의 읽기와 우리가 배워 온 고백이 이 말씀 안에서 만납니다.`}
]},

그때 이렇게 말합니다. "이에 스스로 돌이켜 이르되 내 아버지에게는 양식이 풍족한 품꾼이 얼마나 많은가."

'스스로 돌이켜', 제정신이 들었다는 말입니다. 제게는 이 대목이 기억 버튼을 누르는 순간으로 읽힙니다. 아버지의 집을 기억해 낸 것입니다.`},

    {s:'text', t:'누가복음 15:20', x:800, y:530, z:28, f:'g', c:'red', a:'tc', gap:-200},

    {s:'text', t:'잘잘못을 따지지 않고, 그저 안아 줄 뿐', x:800, y:636, z:58, f:'b', a:'tc', gap:200},
  ], note:`아들은 돌아가며 할 말을 준비했습니다. "나를 품꾼의 하나로 보소서." 품삯 받는 일꾼으로 써 달라는, 일종의 거래입니다.

그런데 아직 거리가 먼데, 아버지가 먼저 보고 달려가 목을 안고 입을 맞춥니다. 아들이 준비한 말을 꺼내지만, 우리 성경을 보면 '품꾼의 하나로 보소서'라는 말은 끝내 나오지 않습니다. 아버지가 종들에게 제일 좋은 옷과 가락지와 신을 가져오게 하니까요.

이문호 교수는 이렇게 말합니다. 돌아온 자녀에게 잘잘못을 따지는 부모는 없다. 그저 안아 줄 뿐이다.`},

  ], note:`그리고 아버지가 말합니다. "이 내 아들은 죽었다가 다시 살아났으며 내가 잃었다가 다시 얻었노라."

아버지는 아들이 집으로 돌아온 일을 다시 살아났다고 부릅니다. 잊었던 집을 기억해 내고 돌아온 것, 그것이 죽었다가 살아난 일이었습니다.

잊고 먼 나라로 떠난 것, 품꾼이 되겠다던 계산이 아버지 품에서 무너진 것, 그리고 다시 살아난 것. 앞에서 말씀드린 한 사람의 이야기가 이 아들 안에 다 들어 있습니다.`}

/* ---------- brush ribbon ---------- */
function prof(t,o,p1,p2){

    const wrapped=[]; for(const l of lines){ if(l!==NB&&emW([l],fam)*(it.z||56)>bw) wrapped.push(...splitLine(l,fam)); else wrapped.push(l); }
    const zw=zOf(wrapped); if(zw>z1*1.08){ lines=wrapped; z1=zw; }
  }
  let two=null;
  if(lines.length>=6){ // 두 단: 가운데에 가장 가까운 빈 줄(연 구분)에서 나눔
    let cut=Math.ceil(lines.length/2), bd=1e9;
    lines.forEach((l,i)=>{ if(l===NB){ const d=Math.abs(i-lines.length/2); if(d<bd){bd=d;cut=i;} } });
    const A=lines.slice(0,cut), B=lines.slice(cut); while(A.length&&A[A.length-1]===NB) A.pop(); while(B.length&&B[0]===NB) B.shift();
    const gap=bw*.07, cw=(bw-gap)/2;
    const z2=Math.min(it.z||56, bh/(Math.max(A.length,B.length)*lh), cw/Math.max(emW(A,fam),emW(B,fam)));
    if(A.length&&B.length&&z2>z1*1.12) two={A,B,z:z2,gap};
  }
  if(!two){
    const z=Math.floor(z1), h=lines.length*z*lh;
    return inkText({t:lines.join('\n'), x:bx+bw/2, y:by+(bh-h)/2, z, f, c, a:'tc', lh, sp, ref:it.ref},start,inst,meta);
  }
  const z=Math.floor(two.z), h=Math.max(two.A.length,two.B.length)*z*lh;
  const wA=emW(two.A,fam)*z, wB=emW(two.B,fam)*z, x0=bx+(bw-(wA+two.gap+wB))/2, y0=by+(bh-h)/2;
  const d1=inkText({t:two.A.join('\n'), x:x0, y:y0, z, f, c, lh, sp},start,inst,meta);
  const d2=inkText({t:two.B.join('\n'), x:x0+wA+two.gap, y:y0, z, f, c, lh, sp},start+d1*.5,inst,meta);
  return Math.max(d1,d1*.5+d2);
}

/* ---------- marks (필담 표시) ---------- */
function boxOf(ref){
  const els=[...texts.querySelectorAll(`[data-ref="${ref}"]`)]; if(!els.length) return null;
  const sr=stage.getBoundingClientRect(); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const e of els){const b=e.getBoundingClientRect(); x0=Math.min(x0,b.left); y0=Math.min(y0,b.top); x1=Math.max(x1,b.right); y1=Math.max(y1,b.bottom);}
  return {x0:(x0-sr.left)/scale,y0:(y0-sr.top)/scale,x1:(x1-sr.left)/scale,y1:(y1-sr.top)/scale};
}
function markPath(it,b,r){
  if(it.kind==='under'){ const y=b.y1+4; return smooth([[b.x0-8,y+3],[(b.x0+b.x1)/2,y-2],[b.x1+14,y+2]]); }
  if(it.kind==='strike'){ return smooth([[b.x0-10,b.y1-10],[b.x1+12,b.y0+14]]); }
  const cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2, rx=(b.x1-b.x0)/2+22, ry=(b.y1-b.y0)/2*.82+6, a0=3.4, pts=[];
  for(let i=0;i<=34;i++){const a=a0+(Math.PI*2.18)*i/34; const k=1+.03*Math.sin(i*.9); pts.push([+(cx+Math.cos(a)*rx*k).toFixed(1),+(cy+Math.sin(a)*ry*k).toFixed(1)]);}
  return smooth(pts);
}

/* ---------- step renderer ---------- */
function renderItem(it,start,inst,r,meta){
  switch(it.s){
    case 'text': return inkText(it,start,inst,meta);
    case 'stroke': return inkStroke(smooth(it.p,it.closed),{...it,w:it.w||12},start,inst,r,meta);
    case 'enso': return inkStroke(ensoPath(it,r),{w:it.w||20,col:it.col,dur:it.dur,ref:it.ref,tail:.12,tailStart:.5},start,inst,r,meta);
    case 'dot': {
      const [cx,cy]=it.c, rad=it.r||10, pts=[]; for(let i=0;i<14;i++){const a=i/14*Math.PI*2; const rr=rad*(1+(r()-.5)*.35); pts.push([+(cx+Math.cos(a)*rr).toFixed(1),+(cy+Math.sin(a)*rr).toFixed(1)]);}
      pts.push(pts[0]);
      const g=el('g',{class:'it','data-ref':it.ref||'','data-step':meta.step,'data-item':meta.item??'',filter:'url(#bleed)'},layer);
      const p=el('path',{d:smooth(pts,true),fill:COL[it.col||'ink'],'fill-opacity':.95},g);
      p.style.transformBox='fill-box'; p.style.transformOrigin='center';
      if(!inst) p.animate([{opacity:0,transform:'scale(.25)'},{opacity:1,transform:'scale(1.08)',offset:.7},{opacity:1,transform:'scale(1)'}],{duration:300,delay:start,fill:'both',easing:'ease-out'});
      return 300; }
    case 'glow': {
      const gid='gl'+(++uid); const rg=el('radialGradient',{id:gid},defs);
      el('stop',{offset:'0','stop-color':it.col||'#d9892b','stop-opacity':.55},rg); el('stop',{offset:'1','stop-color':it.col||'#d9892b','stop-opacity':0},rg);
      const c=el('circle',{cx:it.c[0],cy:it.c[1],r:it.r||40,fill:`url(#${gid})`,class:'it','data-step':meta.step,'data-item':meta.item??''},layer);
      if(!inst) c.animate([{opacity:0},{opacity:1}],{duration:1200,delay:start,fill:'both'}); return 900; }
    case 'figure': {
      let t=start, total=0; figureStrokes(it).forEach((f,k)=>{
        const d=f.enso?ensoPath({c:f.c,r:f.r,a0:-90,sw:350},r):smooth(f.p);
        const dur=inkStroke(d,{w:f.w,c:it.c,dur:f.enso?420:undefined},t,inst,r,meta); t+=dur*.72; total=t-start+dur*.28; });
      return total; }
    case 'dash': {
      const [ax,ay]=it.a,[bx,by]=it.b, len=Math.hypot(bx-ax,by-ay), ux=(bx-ax)/len, uy=(by-ay)/len; let pos=0, t=start;
      while(pos<len-4){const e=Math.min(len,pos+(it.seg||18)); inkStroke(`M${ax+ux*pos},${ay+uy*pos}L${ax+ux*e},${ay+uy*e}`,{w:it.w||5,st:'line',c:it.col,dur:110,dry:0},t,inst,r,meta); t+=70; pos=e+(it.gp||14);}
      return t-start+110; }
    case 'seal': return seal(it,start,inst,meta);
    case 'lyric': return lyric(it,start,inst,r,meta);
    case 'mark': {
      const b=boxOf(it.ref); if(!b) return 0;
      return inkStroke(markPath(it,b,r),{w:it.w||(it.kind==='circle'?7:9),c:it.col||'red',st:'line',tail:.35,dur:it.kind==='circle'?800:450},start,inst,r,meta); }
    case 'dim': case 'vanish': case 'clear': {
      const apply=()=>{
        const all=[...layer.querySelectorAll('.it'),...texts.querySelectorAll('.it')];
        for(const e of all){
          if(it.s==='dim' && +e.dataset.step>=meta.step) continue;
          if(it.s==='vanish' && e.dataset.ref!==it.ref) continue;
          if(it.s==='clear' && +e.dataset.step>meta.step) continue;
          if(inst){ if(it.s==='dim') e.style.opacity=it.to??.25; else e.remove(); }
          else{ e.style.opacity=it.s==='dim'?(it.to??.25):0; if(it.s!=='dim') setTimeout(()=>e.remove(),800); }
        }
      };
      if(inst||start<=0) apply(); else timers.push(setTimeout(apply,start));
      return 0; }
  }
  return 0;
}
let timers=[];
function renderStep(si,k,inst){
  const step=SLIDES[si].steps[k]; let cursor=0,end=0;
  step.items.forEach((it,n)=>{
    const r=rng(hash(`${si}:${k}:${n}`));
    const start=it.at!=null?it.at:Math.max(0,cursor+(n===0?0:(it.gap??100)));
    const meta={step:k,item:String(n)};
    // 'clear' 은 같은 단계 안에서 자기보다 앞선 항목도 지움
    const dur=renderItem(it,inst?0:start,inst,r,meta);
    cursor=start+(['dim','vanish','clear'].includes(it.s)?(it.s==='clear'?260:0):dur);
    end=Math.max(end,start+dur);
  });
  return inst?0:end;
}
function wipe(){ timers.forEach(clearTimeout); timers=[]; layer.textContent=''; texts.textContent='';
  [...defs.querySelectorAll('mask,radialGradient')].forEach(m=>m.remove()); }

/* ---------- navigation ---------- */
let cur=0, step=0, busyUntil=0, t0=Date.now();
function partLabel(S){ if(!S.part) return; const e=document.createElement('div'); e.className='part'; e.textContent=S.part; texts.appendChild(e); }
function show(i,k,animLast){
  wipe(); cur=i; step=k; busyUntil=0; partLabel(SLIDES[i]);
  content.classList.add('noanim');
  for(let s=0;s<=k;s++){const a=animLast&&s===k;
    if(a){ void content.offsetWidth; content.classList.remove('noanim'); }
    const e=renderStep(i,s,!a); if(a) busyUntil=performance.now()+e;}
  void content.offsetWidth; content.classList.remove('noanim');
  ui();
}
function next(){
  if(performance.now()<busyUntil-60){ show(cur,step,false); return; }
  if(step<SLIDES[cur].steps.length-1){ step++; busyUntil=performance.now()+renderStep(cur,step,false); ui(); }
  else if(cur<SLIDES.length-1) go(cur+1);
}
function prev(){ if(step>0) show(cur,step-1,false); else if(cur>0) show(cur-1,SLIDES[cur-1].steps.length-1,false); }
let going=false;
function go(i){ if(going) return; going=true; content.style.opacity=0;
  setTimeout(()=>{ show(i,0,true); content.style.opacity=1; going=false; },400); }

/* ---------- 예상 시간 (원고 분량으로 계산: 분당 260자 + 멈춤) ---------- */
function est(S){ let chars=0,pause=0;
  for(const st of S.steps){ let n=(st.note||'').replace(/^\[[^\]]*\][^\n]*\n*/,'');
    (n.match(/\((잠시|30초|웃음)[^)]*\)/g)||[]).forEach(c=>{pause+=c.includes('30초')?32:c.includes('웃음')?5:10;});
    chars+=n.replace(/\((잠시|30초|웃음)[^)]*\)/g,'').replace(/\s/g,'').length; pause+=3; }
  return Math.round(chars/260*60+pause); }
const EST=SLIDES.map(est), CUM=[]; EST.reduce((a,v,i)=>(CUM[i]=a+v),0);
const mmss=v=>`${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`;
function timeTag(i){ return `예상 ${mmss(EST[i])} · 누적 ${mmss(CUM[i])} / ${mmss(CUM[CUM.length-1])}`; }

/* ---------- notes / presenter / hud ---------- */
const hud=document.getElementById('hud'), notes=document.getElementById('notes'), toast=document.getElementById('toast');
let hudT; function pokeHud(){ hud.classList.add('on'); clearTimeout(hudT); hudT=setTimeout(()=>hud.classList.remove('on'),2500); }
function fmtNote(t){ return (t||'').split('\n\n').map(p=>'<p style="margin:0 0 .55em">'+p.replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/(\((잠시|30초|웃음)[^)]*\))/g,'<span class="cue">$1</span>').replace(/^(\[[^\]]+\])/,'<span class="cue">$1</span>')+'</p>').join(''); }
let pw=null; const SID=String(Math.random());
function ui(){
  const S=SLIDES[cur]; hud.textContent=`${cur+1} / ${SLIDES.length}  ·  ${S.name}  ·  ${step+1}/${S.steps.length}`; pokeHud();
  notes.innerHTML=`<div class="meta">${cur+1}. ${S.name} · 단계 ${step+1}/${S.steps.length} · ${timeTag(cur)}</div>`+fmtNote(S.steps[step].note);
  if(pw&&!pw.closed) presenter();
}
function nextNote(){ const S=SLIDES[cur]; if(step<S.steps.length-1) return S.steps[step+1].note; const N=SLIDES[cur+1]; return N?`[다음 장: ${N.name}] `+N.steps[0].note:'(마지막)'; }
function presenter(){
  const d=pw.document, S=SLIDES[cur], el_=(id)=>d.getElementById(id);
  if(d.body.dataset.sid!==SID){
    d.head.querySelectorAll('style').forEach(x=>x.remove());
    d.title='발표자 원고';
    const st=d.createElement('style');
    st.textContent=`body{margin:0;font:22px/1.75 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f6f0e2;color:#231f1a}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 22px;background:#231f1a;color:#f3ead6;font-size:17px;position:sticky;top:0}
#clock{font-variant-numeric:tabular-nums;font-size:22px;margin-right:6px}main{padding:18px 26px}#now{font-size:25px}
#next{margin-top:18px;padding-top:12px;border-top:1px dashed #b9a988;color:#7a705f;font-size:17px;line-height:1.6}
.cue{color:#8a7f6c}button{font:16px inherit;margin-left:8px;padding:6px 14px;border-radius:6px;border:0;background:#e9dfc8;cursor:pointer}`;
    d.head.appendChild(st);
    d.body.innerHTML=`<header><span id="where"></span><span><span id="clock"></span><button id="bp">◀ 이전</button><button id="bn">다음 ▶</button><button id="br">시계 0</button></span></header>
<main><div id="now"></div><div id="next"></div></main>`;
    d.body.dataset.sid=SID;
    el_('bn').onclick=()=>next(); el_('bp').onclick=()=>prev(); el_('br').onclick=()=>{t0=Date.now();};
    setInterval(()=>{ if(pw.closed) return; const s=Math.floor((Date.now()-t0)/1000); el_('clock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; },500);
  }
  d.onkeydown=key; // 창을 연 직후 브라우저가 리스너를 지우는 경우가 있어 매번 다시 건다
  el_('where').textContent=`${cur+1}/${SLIDES.length} · ${S.name} · 단계 ${step+1}/${S.steps.length} · ${timeTag(cur)}`;
  el_('now').innerHTML=fmtNote(S.steps[step].note);
  el_('next').innerHTML='<b>다음 →</b> '+fmtNote(nextNote()).replace(/<p[^>]*>/g,'').replace(/<\/p>/g,' ');
}
function openPresenter(){
  pw=window.open('','kangmin_presenter','width=980,height=720');
  if(!pw){ say('팝업이 막혔습니다. N 키로 화면 아래에 원고를 띄울 수 있습니다.'); return; }
  presenter(); setTimeout(()=>{ if(pw&&!pw.closed) presenter(); },300);
}
function say(m){ toast.textContent=m; toast.classList.add('on'); setTimeout(()=>toast.classList.remove('on'),2600); }
function key(e){
  const k=e.key;
  if(lyOpen()){ if(k==='Escape') lyHide(); return; }
  if(e.target&&/^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
  else if(k==='Home') show(0,0,true);
  else if(k==='End') show(SLIDES.length-1,SLIDES[SLIDES.length-1].steps.length-1,false);
  else if(k==='f'||k==='F'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  else if(k==='n'||k==='N') notes.classList.toggle('on');
  else if(k==='p'||k==='P') openPresenter();
  else if(k==='t'||k==='T'){ t0=Date.now(); say('시계를 0으로 돌렸습니다'); }
  else if(k==='r'||k==='R') show(cur,step,true);
  else if(k==='l'||k==='L'){ e.preventDefault(); lyShow(); }
}
/* ---------- 가사 넣기 창 (L) ---------- */
const lyp=document.getElementById('lypanel');
const lyTA=()=>[...lyp.querySelectorAll('textarea[data-id]')];
function lyOpen(){ return lyp&&!lyp.hidden; }
function lyShow(){ lyTA().forEach(ta=>{ ta.value=lyricText(ta.dataset.id); }); lyp.hidden=false; setTimeout(()=>lyTA()[0]?.focus(),30); }
function lyHide(){ lyp.hidden=true; }
function lyApply(){
  const o={}; lyTA().forEach(ta=>{ const id=ta.dataset.id, v=ta.value; LY[id]=v.trim()?v:(LYF[id]||''); o[id]=v; });
  try{ localStorage.setItem(LYK,JSON.stringify(o)); }catch(e){}
  show(cur,step,false);
}
function lySave(){
  lyApply();
  if(!SRC0){ say('이 화면에서는 파일로 저장할 수 없습니다.'); return; }
  const html=SRC0.replace(/(<script type="text\/plain" id="lyrics-(\d+)">)([\s\S]*?)(<\/script>)/g,
    (m,a,id,body,b)=>a+'\n'+String(LY[id]||'').replace(/<\/(script)/gi,'<\\/$1')+'\n'+b);
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    a.download='하늘뜻펴기_이미집에있습니다_장표_가사포함.html'; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000);
    say('가사를 넣은 새 파일을 내려받습니다.');
  }catch(e){ say('파일로 저장하지 못했습니다. 내려받은 html 파일에서 다시 해 보세요.'); }
}
function lyImport(fl){ // 전에 '가사를 넣은 파일로 저장'으로 받은 장표 html에서 가사 칸 세 곳을 읽어 옴
  const fr=new FileReader();
  fr.onload=()=>{
    const src=String(fr.result||''); let n=0;
    src.replace(/<script type="text\/plain" id="lyrics-(\d+)">([\s\S]*?)<\/script>/g,(m,id,body)=>{
      const ta=lyp.querySelector(`textarea[data-id="${id}"]`), v=body.replace(/<\\\/(script)/gi,'</$1').replace(/^\n+|\n+$/g,'');
      if(ta&&v.trim()){ ta.value=v; n++; } return m; });
    if(n){ lyApply(); say(`가사 ${n}곳을 가져와 적용했습니다.`+(location.protocol==='file:'?" '가사를 넣은 파일로 저장'을 누르면 새 파일에 담깁니다.":'')); }
    else say('그 파일에서 가사를 찾지 못했습니다.');
  };
  fr.onerror=()=>say('파일을 읽지 못했습니다.');
  fr.readAsText(fl,'utf-8');
}
if(lyp){
  if(location.protocol!=='file:'){ // 웹에 올린 장표에서는 이 브라우저에 기억만 하고, 파일 저장은 내려받은 html에서
    document.getElementById('lySave').style.display='none';
    const sub=lyp.querySelector('.sub'); if(sub) sub.textContent='가사를 붙여 넣고 적용을 누르면 장표에 바로 나옵니다. 이 브라우저에만 기억됩니다. 가사를 파일에 넣어 두려면 내려받은 장표 html 파일을 열어 이 창을 쓰세요. 전에 가사를 넣어 저장한 장표 파일이 있으면 이전 파일에서 가져오기로 그 가사를 옮겨 올 수 있습니다. 줄바꿈은 그대로 나오고, 빈 줄은 연 구분입니다.';
  }
  document.getElementById('lyApply').onclick=()=>{ lyApply(); lyHide(); say('가사를 적용했습니다.'); };
  document.getElementById('lySave').onclick=()=>{ lySave(); };
  document.getElementById('lyClear').onclick=()=>{ lyTA().forEach(ta=>{ ta.value=''; }); };
  const lyFile=document.getElementById('lyFile');
  document.getElementById('lyLoad').onclick=()=>{ lyFile.value=''; lyFile.click(); };
  lyFile.onchange=()=>{ const fl=lyFile.files&&lyFile.files[0]; if(fl) lyImport(fl); };
  document.getElementById('lyClose').onclick=()=>lyHide();
  lyp.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.stopPropagation(); lyHide(); } });
}
document.addEventListener('keydown',key);
document.addEventListener('mousemove',pokeHud);
stage.addEventListener('click',e=>{ const x=(e.clientX-stage.getBoundingClientRect().left)/scale; if(x<W*.18) prev(); else next(); });
addEventListener('resize',fit);

/* ---------- start ---------- */
fit(); drawPaper();
const fams=['EastSea','NanumBrush','SongMyung','GowunBatang','YujiSyuku'];
Promise.all(fams.map(f=>document.fonts.load(`40px "${f}"`).catch(()=>null))).then(()=>document.fonts.ready).then(()=>{
  const si=clamp(parseInt(Q.get('s')||'1',10)-1,0,SLIDES.length-1);
  const k=Q.has('k')?clamp(parseInt(Q.get('k'),10)-1,0,SLIDES[si].steps.length-1):0;
  if(Q.has('k')) show(si,k,Q.get('anim')==='1'); else show(si,0,true);
  if(Q.get('hud')==='0'){ hud.style.display='none'; }
  else{ const h=document.getElementById('hint'); h.classList.add('on'); setTimeout(()=>h.classList.remove('on'),5200); }
  document.body.dataset.ready='1';
  window.__deck={ get busy(){ return Math.round(busyUntil-performance.now()); }, get pos(){ return [cur+1,step+1]; },
    setLyrics(o){ Object.assign(LY,o); show(cur,step,false); }, get srcLen(){ return SRC0.length; } };
});
})();
